# magi competing on chronicle.vim.
#
# **Only what is peculiar to this checkout lives here.** The roster, the seat
# assignment, the shape of a run and the update policy are all machine facts,
# not repository facts — they moved to the machine layer
# (`<config_dir>/magi/config.toml`) and are not restated here. What that
# leaves, and why each one still has to be here:
#
# - `[verify]` runs `deno`, against a Deno/denops repo. The machine layer
#   cannot know that.
# - `[merge] base` names this repository's default branch, and is required at
#   all because of how every checkout on this machine is set up (see below).
# - `[prompts]` restates the jj-colocated etiquette the machine layer already
#   states under the same key, plus this repository's own conventions. A
#   scalar key is replaced whole by the highest layer that sets it, not
#   merged, so leaving the jj text out here would silently drop it for this
#   repo.
#
# Note that an array may be declared in exactly one layer
# (`Config::refuse_split_arrays`), so `[verify]`'s arrays being here is also
# why the roster's arrays are *only* in the machine layer.
#
# Rendered by teravars. Tera braces are live everywhere in this file, but
# comments are stripped before Tera sees them (teravars >= 0.2.2), so a
# comment may quote `{{ ... }}` freely.

[verify]
# The real-machine leg, run in the winner's worktree once per review round:
# `deno.json`'s `test` task.
e2e = ["deno task test"]
# `deno.json`'s `ci` task: check + lint + fmt --check + test, the same step
# `.github/workflows/ci.yml` runs. No test uses `@denops/test` today, so this
# needs only deno. Anything that needs real Vim / Neovim is left to CI, which
# installs pinned editors — the magi machine is only assumed to have
# Rust / bun / deno.
gate = ["deno task ci"]

[merge]
# `mode` is deliberately *not* set here: the machine layer already carries
# `mode = "pr"`, chosen fleet-wide after a run landed clean and then sat
# unmerged because `"none"` only prints the merge command and nothing runs
# it. `mode` isn't a fact about this repository, so restating it would
# silently reintroduce that failure mode for chronicle.vim alone — verified
# with `magi doctor`, which resolves `merge` to `Pr` as long as this table
# only sets `base` (table keys merge per-field across layers, so an unset key
# here falls through to the machine layer instead of resetting to magi's
# built-in default).
#
# `base` still has to be here, and in every jj-colocated repo: jj keeps git's
# HEAD detached at the working-copy commit, so magi cannot infer the base
# branch from `git symbolic-ref HEAD`. This repository's default branch is
# `main`.
base = "main"

# Project conventions appended to the node prompts, never merged into them.
# Repository-wide context lives in AGENTS.md, which every agent already reads
# from the checkout; these are the things a magi *node* needs to know.
[prompts]
all = """
This repository uses jj (Jujutsu) with a colocated git repo. `git commit` works \
in a candidate worktree and is what magi expects, but never run `jj` commands \
and never touch the main working copy.
This is a denops (Vim/Neovim) plugin. Tests that spawn real Vim / Neovim via \
`@denops/test` only run in CI; verify.e2e and verify.gate do not provide editors.
"""
